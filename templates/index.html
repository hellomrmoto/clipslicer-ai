<!DOCTYPE html>
<html>
<head><title>ClipSlicer.ai</title></head>
<body>
  <h1>ClipSlicer.ai</h1>
  <form id="uploadForm">
    <input type="text" id="youtubeUrl" placeholder="Paste YouTube link..." required>
    <button type="submit">Submit</button>
  </form>
  <div id="status"></div>
  <ul id="clipsList"></ul>

  <hr>
  <h2>Job History</h2>
  <button onclick="loadHistory()">Refresh History</button>
  <table id="historyTable" border="1" cellpadding="6" style="border-collapse:collapse;margin-top:8px;">
    <thead>
      <tr>
        <th>Job ID</th>
        <th>YouTube URL</th>
        <th>Status</th>
        <th>Clips</th>
        <th>Created At</th>
      </tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const url = document.getElementById('youtubeUrl').value;
      const res = await fetch('/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ youtube_url: url })
      });
      const { job_id } = await res.json();
      const statusDiv = document.getElementById('status');
      const clipsList = document.getElementById('clipsList');

      statusDiv.innerText = 'Processing...';
      const interval = setInterval(async () => {
        const r = await fetch(`/status/${job_id}`);
        const data = await r.json();
        if (data.status === 'completed') {
          clearInterval(interval);
          statusDiv.innerText = 'Done!';
          clipsList.innerHTML = '';
          data.clips.forEach(c => {
            const li = document.createElement('li');
            li.innerText = `${c.clip} (${c.note})`;
            clipsList.appendChild(li);
          });
          loadHistory();
        } else if (data.status === 'error') {
          clearInterval(interval);
          statusDiv.innerText = 'Error: ' + data.error;
          loadHistory();
        }
      }, 3000);
    });

    async function loadHistory() {
      const res = await fetch('/history');
      const jobs = await res.json();
      const tbody = document.getElementById('historyBody');
      tbody.innerHTML = '';
      jobs.forEach(job => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:0.8em">${job.id}</td>
          <td><a href="${job.youtube_url}" target="_blank">${job.youtube_url}</a></td>
          <td>${job.status}</td>
          <td>${job.clips.length}</td>
          <td>${job.created_at}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadHistory();
  </script>
</body>
</html>
